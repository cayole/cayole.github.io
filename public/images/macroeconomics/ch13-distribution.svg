<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" role="img" aria-labelledby="title desc">
<title id="title">平均变富不是每个人都同比变好</title><desc id="desc">同一次技术变化可以降低消费成本、替代部分任务、提高互补技能需求、改变资产收益。新岗位不保证原劳动者无成本转入，需要另外观察转型与分配。</desc>
<rect width="960" height="710" fill="#f6f1e8"/><g font-family="sans-serif" fill="#242424"><rect x="40" y="38" width="80" height="8" fill="#eb6b32"/><text x="40" y="97" font-size="34" font-weight="700">一条向上的线，几种不同的经历</text><text x="40" y="140" font-size="22">传导渠道示意；影响方向与大小取决于具体条件</text>
<rect x="265" y="177" width="430" height="72" rx="8" fill="#eb6b32"/><text x="310" y="222" font-size="26" font-weight="700">新方法改善生产能力</text>
<path d="M480 249V278H252V305M480 278H708V305" fill="none" stroke="#242424" stroke-width="3"/>
<rect x="40" y="307" width="425" height="130" rx="8" fill="#fff" stroke="#cfc8bc"/><text x="65" y="349" font-size="25" font-weight="700">消费者</text><text x="65" y="390" font-size="22">价格、质量与新品种可能改善</text><text x="65" y="421" font-size="19">但每户消费结构与收入也不同</text>
<rect x="495" y="307" width="425" height="130" rx="8" fill="#242424"/><text x="520" y="349" fill="#fff" font-size="25" font-weight="700">劳动者</text><text x="520" y="390" fill="#fff" font-size="22">有的任务被替代，有的更稀缺</text><text x="520" y="421" fill="#fff" font-size="19">转岗、学习与搬迁有真实成本</text>
<rect x="40" y="467" width="425" height="130" rx="8" fill="#fff" stroke="#cfc8bc"/><text x="65" y="509" font-size="25" font-weight="700">设备与知识资产所有者</text><text x="65" y="550" font-size="22">可能获得工资以外的收益</text><text x="65" y="581" font-size="19">资本收入、劳动收入要分开看</text>
<rect x="495" y="467" width="425" height="130" rx="8" fill="#fff" stroke="#eb6b32"/><text x="520" y="509" font-size="25" font-weight="700">转型条件</text><text x="520" y="550" font-size="22">培训、匹配、流动与收入保障</text><text x="520" y="581" font-size="19">影响谁能参与，谁承担成本</text>
<text x="40" y="648" font-size="24">总量增长不等于人人受益；技术也不是分配的唯一原因。</text><text x="40" y="688" font-size="19">判断个人处境时，工资、总收入与财富不能互相替代。</text></g></svg>
