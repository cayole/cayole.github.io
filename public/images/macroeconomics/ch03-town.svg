    <text x="856" y="315" text-anchor="middle" font-size="21">修路中</text>
    <g font-size="24" text-anchor="middle">
      <text x="177" y="535">有人多买一袋面包</text>
      <text x="480" y="535">有人多接一笔订单</text>
      <text x="786" y="535">有人多一份收入</text>
    </g>
    <path d="M304 525H345 M610 525H651" stroke="#b9341f" stroke-width="3"/>
    <text x="480" y="601" text-anchor="middle" font-size="23" fill="#b9341f">你的支出，可能就是隔壁店的下一笔收入。</text>
  </g>
