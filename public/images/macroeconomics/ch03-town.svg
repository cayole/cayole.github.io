      <path d="M328 260 360 205H505L538 260Z" fill="#e4e0d6"/>
      <path d="M344 260V383H521V260Z" fill="#f1eee6"/>
      <path d="M366 310H412V349H366Z M446 310H490V383H446Z" fill="#f8f7f3"/>
      <path d="M584 260 616 205H761L794 260Z" fill="#ff5938"/>
      <path d="M600 260V383H777V260Z" fill="#f1eee6"/>
      <path d="M622 310H668V349H622Z M702 310H746V383H702Z" fill="#f8f7f3"/>
    </g>
    <g text-anchor="middle" font-size="23" font-weight="700">
      <text x="177" y="294">面包店</text><text x="432" y="294">理发店</text><text x="688" y="294">书店</text>
    </g>
    <g fill="#171717">
      <circle cx="183" cy="405" r="7"/><path d="M183 414V443 M183 424 170 435 M183 424 196 435 M183 443 174 459 M183 443 193 459" stroke="#171717" stroke-width="4"/>
      <circle cx="461" cy="405" r="7"/><path d="M461 414V443 M461 424 448 435 M461 424 474 435 M461 443 452 459 M461 443 471 459" stroke="#171717" stroke-width="4"/>
