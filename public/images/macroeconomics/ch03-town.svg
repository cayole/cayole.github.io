<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">河湾镇，一条街里的经济学</title>
  <desc id="desc">一条街上有面包店、理发店和书店，旁边的工程队正在修路。新增订单形成收入，收入带来新的消费，连接起不同店铺。</desc>
  <rect width="960" height="640" fill="#f8f7f3"/>
  <g font-family="'Microsoft YaHei', sans-serif" fill="#171717">
    <text x="48" y="58" font-size="18" fill="#b9341f" letter-spacing="2">RIVERBEND / 河湾镇</text>
    <text x="48" y="111" font-size="38" font-weight="700">一条街，藏着一整个经济循环。</text>
    <circle cx="841" cy="203" r="39" fill="#ff5938"/>
    <path d="M48 388H912 M48 477H912" stroke="#cbc6ba" stroke-width="2"/>
    <path d="M48 435H912" stroke="#97958f" stroke-width="3" stroke-dasharray="28 20"/>
    <g stroke="#171717" stroke-width="3">
      <path d="M72 260 105 205H250L282 260Z" fill="#ff5938"/>
      <path d="M89 260V383H266V260Z" fill="#f1eee6"/>
