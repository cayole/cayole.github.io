<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 825" role="img" aria-labelledby="title desc">
<title id="title">金融冲击如何走回那条街</title><desc id="desc">抵押贷款受损引起资产减值、资本下降、缩表与抛售，融资变贵或被拒，店铺取消投资。短期资金不续借会放大抛售，抛售又压低资产估值。</desc>
<rect width="960" height="825" fill="#f8f7f3"/><g font-family="'Microsoft YaHei', sans-serif" fill="#171717">

<text x="48" y="62" font-size="33" font-weight="700">坏消息先到银行，最后回到面包店。</text>
<rect x="48" y="145" width="408" height="140" fill="#f1eee6" stroke="#cbc6ba"/><text x="72" y="199" font-size="28" font-weight="700">抵押贷款受损</text><text x="72" y="249" font-size="22">还款变少，回收更难</text><rect x="504" y="145" width="408" height="140" fill="#f1eee6" stroke="#cbc6ba"/><text x="528" y="199" font-size="28" font-weight="700">资产估值下降</text><text x="528" y="249" font-size="22">损失侵蚀资本</text><rect x="504" y="345" width="408" height="140" fill="#f1eee6" stroke="#cbc6ba"/><text x="528" y="399" font-size="28" font-weight="700">缩表与抛售</text><text x="528" y="449" font-size="22">短期融资不愿续借</text><rect x="48" y="345" width="408" height="140" fill="#f1eee6" stroke="#cbc6ba"/><text x="72" y="399" font-size="28" font-weight="700">融资报价上升</text><text x="72" y="449" font-size="22">或者直接拒贷</text><rect x="48" y="545" width="408" height="140" fill="#f1eee6" stroke="#cbc6ba"/><text x="72" y="599" font-size="28" font-weight="700">烤箱订单取消</text><text x="72" y="649" font-size="22">设备商收入下降</text><rect x="504" y="545" width="408" height="140" fill="#f1eee6" stroke="#cbc6ba"/><text x="528" y="599" font-size="28" font-weight="700">店铺与家庭更谨慎</text><text x="528" y="649" font-size="22">需求与收入继续受压</text>
<g fill="none" stroke="#b9341f" stroke-width="3"><path d="M459 214H493 M485 207 493 214 485 221 M708 295V333 M701 325 708 333 715 325 M493 414H461 M469 407 461 414 469 421 M252 495V533 M245 525 252 533 259 525 M459 615H493 M485 608 493 615 485 622"/>
<path d="M920 414H938V115H708V133 M701 125 708 133 715 125" stroke-dasharray="6 5"/></g>
<text x="48" y="749" font-size="23">虚线反馈：折价抛售压低估值，让资本进一步受损。</text><text x="48" y="794" font-size="20" fill="#65625c">示意图，不按时间或规模等比例。信用利差与拒贷之外，信心下降也可直接压低支出。</text>
</g></svg>
