<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">提高储蓄的现在与以后</title><desc id="desc">固定劳动和技术，生产函数每人产出等于资本平方根，折旧10%。储蓄率从10%提高到20%，当期资本产出不变，消费从0.9降到0.8；长期正稳态资本4、产出2、消费1.6。</desc>
<rect width="960" height="690" fill="#f6f1e8"/><g font-family="sans-serif" fill="#242424"><rect x="40" y="38" width="80" height="8" fill="#eb6b32"/><text x="40" y="97" font-size="34" font-weight="700">储蓄多一点，不是明天就多一座工厂</text><text x="40" y="140" font-size="22">假设劳动与技术固定；y = √k；折旧率 10%</text>
<g font-size="23"><rect x="40" y="185" width="270" height="330" rx="8" fill="#fff" stroke="#cfc8bc"/><rect x="345" y="185" width="270" height="330" rx="8" fill="#fff" stroke="#eb6b32"/><rect x="650" y="185" width="270" height="330" rx="8" fill="#242424"/>
<text x="65" y="230" font-weight="700">原来的正稳态</text><text x="65" y="280">储蓄率 10%</text><text x="65" y="330">资本 k = 1</text><text x="65" y="380">产出 y = 1</text><text x="65" y="430">消费 c = 0.9</text><text x="65" y="485" font-size="20">投资恰好补折旧</text>
<text x="370" y="230" font-weight="700">提高储蓄的当期</text><text x="370" y="280">储蓄率 20%</text><text x="370" y="330">资本 k = 1</text><text x="370" y="380">产出 y = 1</text><text x="370" y="430" fill="#b44213">消费 c = 0.8</text><text x="370" y="485" font-size="20">先少消费，开始积累</text>
<g fill="#fff"><text x="675" y="230" font-weight="700">新的正稳态</text><text x="675" y="280">储蓄率 20%</text><text x="675" y="330">资本 k = 4</text><text x="675" y="380">产出 y = 2</text><text x="675" y="430">消费 c = 1.6</text><text x="675" y="485" font-size="20">最终增速重新趋于零</text></g></g>
<text x="40" y="574" font-size="24">中间需要逐期积累；有限期演示不等于已经到达稳态。</text><text x="40" y="620" font-size="22">更高的长期水平 ≠ 永远更高的长期增长率。</text><text x="40" y="661" font-size="19">每劳动者单位；s 从 0.1 到 0.2，正稳态 k* = (s / δ)²。</text></g></svg>
