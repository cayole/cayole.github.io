<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">银行的损失先落在资本上</title><desc id="desc">初始资产100、负债80、资本20。资产损失10后，资产90、负债80、资本10；资产下降10%，资本减少50%。</desc>
<rect width="960" height="680" fill="#f8f7f3"/><g font-family="'Microsoft YaHei', sans-serif" fill="#171717">

<text x="48" y="64" font-size="34" font-weight="700">资产打九折，资本为什么只剩一半？</text>
<text x="48" y="112" font-size="22" fill="#65625c">资本是资产减负债的余额，不是另一笔准备金。</text>
<text x="48" y="193" font-size="27" font-weight="700">损失之前：资产 100</text>
<rect x="48" y="224" width="672" height="90" fill="#cbc6ba"/><rect x="720" y="224" width="168" height="90" fill="#ff5938"/>
<text x="384" y="280" font-size="27" text-anchor="middle">负债 80</text><text x="804" y="280" font-size="25" text-anchor="middle">资本 20</text>
<text x="48" y="396" font-size="27" font-weight="700">损失之后：资产 90</text>
<rect x="48" y="428" width="672" height="90" fill="#cbc6ba"/><rect x="720" y="428" width="84" height="90" fill="#ff5938"/><rect x="804" y="428" width="84" height="90" fill="none" stroke="#97958f" stroke-dasharray="6 6"/>
<text x="384" y="485" font-size="27" text-anchor="middle">负债仍为 80</text><text x="762" y="485" font-size="25" text-anchor="middle">10</text><text x="846" y="485" font-size="22" text-anchor="middle">损失</text>
<text x="48" y="590" font-size="27" font-weight="700">资产承担损失，债务承诺不会自动打折。</text><text x="48" y="645" font-size="20" fill="#65625c">初始杠杆 100/20 = 5 倍；损失后杠杆 90/10 = 9 倍。均为教学账本。</text>
</g></svg>
