<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 725" role="img" aria-labelledby="title desc">
<title id="title">不同政策组合的结果</title><desc id="desc">统一模型下，多修路、只降息、两边支持和缩减采购同时降息，分别得到950、916.67、1016.67和850的均衡产出。</desc>
<rect width="960" height="725" fill="#f8f7f3"/><g font-family="'Microsoft YaHei', sans-serif" fill="#171717">

<text x="48" y="62" font-size="33" font-weight="700">同一座小镇，四种政策接力。</text><text x="48" y="108" font-size="22" fill="#65625c">起点：G = 150，i = 4%，Y = 850，I = 150。</text>
<rect x="48" y="155" width="408" height="220" fill="#f1eee6" stroke="#cbc6ba"/><text x="72" y="198" font-size="26" font-weight="700">多修路</text><text x="72" y="242" font-size="21">G 150 → 180；i 保持 4%</text><text x="72" y="294" font-size="29" fill="#b9341f">Y = 950.00</text><text x="72" y="338" font-size="20">IS 右移，LM 不动</text><rect x="504" y="155" width="408" height="220" fill="#f1eee6" stroke="#cbc6ba"/><text x="528" y="198" font-size="26" font-weight="700">只降息</text><text x="528" y="242" font-size="21">G 保持 150；i 4% → 2%</text><text x="528" y="294" font-size="29" fill="#b9341f">Y = 916.67</text><text x="528" y="338" font-size="20">IS 不动，LM 下移</text><rect x="48" y="407" width="408" height="220" fill="#f1eee6" stroke="#cbc6ba"/><text x="72" y="450" font-size="26" font-weight="700">两边一起支持</text><text x="72" y="494" font-size="21">G → 180；i → 2%</text><text x="72" y="546" font-size="29" fill="#b9341f">Y = 1,016.67</text><text x="72" y="590" font-size="20">IS 右移，LM 下移</text><rect x="504" y="407" width="408" height="220" fill="#f1eee6" stroke="#cbc6ba"/><text x="528" y="450" font-size="26" font-weight="700">少采购，降息接力</text><text x="528" y="494" font-size="21">G → 130；i → 2%</text><text x="528" y="546" font-size="29" fill="#b9341f">Y = 850.00</text><text x="528" y="590" font-size="20">总量不变，投资替代部分采购</text>
<text x="48" y="688" font-size="20" fill="#65625c">原创教学模型，预期通胀与风险溢价先设为零。不同组合的支出构成并不相同。</text>
</g></svg>
